# Release tags: v<upstream x.y.z>-derbent.<N>, e.g. v4.1.2-derbent.1 (a release).
# A trailing .dev (v4.1.2-derbent.1.dev) marks a pre-release (channel=dev).
name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-derbent.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-derbent.[0-9]+.dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ github.ref_name }}"
      channel: "${{ github.ref_type == 'tag' && endsWith(github.ref_name, 'dev') && 'dev' || github.ref_type != 'tag' && 'dev' || 'prod' }}"
