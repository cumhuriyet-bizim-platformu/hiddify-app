name: CI
# Derbent: manual only (Actions minutes are limited). Run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: "Sign the builds and keep them as workflow artifacts"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      
